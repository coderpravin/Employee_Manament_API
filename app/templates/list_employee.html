<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <title>Employee List</title>
  </head>
  <body>
    <h1>Employee List</h1>

    <div class="container-fluid mt-5">
        <table class="table table-striped table-hover table-bordered text-center align-middle">
            <thead>
                <tr>
                    <th class="py-3">Sr No.</th>
                    <th class="py-3">Employee Name</th>
                    <th class="py-3">Employee Email</th>
                    <th class="py-3">Employee Mobile</th>
                    <th class="py-3">Employee Department</th>
                    <th class="py-3">Action</th>
                </tr>
            </thead>

            <tbody>
                {% for employee in employees %}
                <tr>
                    <td>{{forloop.counter}}</td>
                    <td class="fw-bold">{{employee.name}}</td>
                    <td class="fw-bold">{{employee.email}}</td>
                    <td class="fw-bold">{{employee.mobile}}</td>
                    <td class="fw-bold">{{employee.department.name}}</td>
                    <td>
                        <button type="button" class="btn btn-outline-primary">Edit</button>
                        <button type="button" class="btn btn-outline-danger">Delete</button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>    

    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>


  </body>
</html>
